name: Capture website project previews
on:
  workflow_dispatch:
  push:
    branches: [feature/website-project-previews]
    paths:
      - '.github/workflows/project-previews.yml'
      - 'scripts/capture-project-previews.cjs'
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify screenshot script exists
        run: test -f scripts/capture-project-previews.cjs
      - name: Capture website screenshots
        run: node scripts/capture-project-previews.cjs
      - name: Commit captured previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/project-previews/*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add real website screenshots for project cards"
            git push
          fi
